services:
  # =========================================================================
  # USER CONTEXT
  # =========================================================================
  User.Repository:
    class: src/Contexts/Core/User/infrastructure/persistence/TypeOrmUserRepository
    arguments: ["@Shared.ORM.Connection"]

  User.FindByCriteria.Finder:
    class: src/Contexts/Core/User/application/FindByCriteria/Finder
    arguments: ["@User.Repository"]

  User.FindByCriteria.FindUsersByCriteriaQueryHandler:
    class: src/Contexts/Core/User/application/FindByCriteria/FindUserByCriteriaQueryHandler
    arguments: ["@User.FindByCriteria.Finder"]
    tags:
      - { name: "queryHandler" }

  User.FindUserById.Finder:
    class: src/Contexts/Core/User/application/FindUserById/Finder
    arguments: ["@User.Repository"]

  User.FindUserById.FindUserByIdQueryHandler:
    class: src/Contexts/Core/User/application/FindUserById/FindUserByIdQueryHandler
    arguments: ["@User.FindUserById.Finder"]
    tags:
      - { name: "queryHandler" }

  User.Create.Creator:
    class: src/Contexts/Core/User/application/Create/Creator
    arguments: ["@User.Repository"]

  User.Create.CreateUserCommandHandler:
    class: src/Contexts/Core/User/application/Create/CreateUserCommandHandler
    arguments: ["@User.Create.Creator"]
    tags:
      - { name: "commandHandler" }

  User.Delete.Deleter:
    class: src/Contexts/Core/User/application/Delete/Deleter
    arguments: ["@User.Repository"]

  User.Delete.DeleteUserCommandHandler:
    class: src/Contexts/Core/User/application/Delete/DeleteUserCommandHandler
    arguments: ["@User.Delete.Deleter"]
    tags:
      - { name: "commandHandler" }

  User.UpdateName.Updater:
    class: src/Contexts/Core/User/application/UpdateName/Updater
    arguments: ["@User.Repository"]

  User.UpdateName.UpdateUserNameCommandHandler:
    class: src/Contexts/Core/User/application/UpdateName/UpdateUserNameCommandHandler
    arguments: ["@User.UpdateName.Updater"]
    tags:
      - { name: "commandHandler" }

  User.UpdatePassword.Updater:
    class: src/Contexts/Core/User/application/UpdatePassword/Updater
    arguments: ["@User.Repository"]

  User.UpdatePassword.UpdateUserPasswordCommandHandler:
    class: src/Contexts/Core/User/application/UpdatePassword/UpdateUserPasswordCommandHandler
    arguments: ["@User.UpdatePassword.Updater"]
    tags:
      - { name: "commandHandler" }

  User.UpdatePhone.Updater:
    class: src/Contexts/Core/User/application/UpdatePhone/Updater
    arguments: ["@User.Repository"]

  User.UpdatePhone.UpdateUserPhoneCommandHandler:
    class: src/Contexts/Core/User/application/UpdatePhone/UpdateUserPhoneCommandHandler
    arguments: ["@User.UpdatePhone.Updater"]
    tags:
      - { name: "commandHandler" }

  User.Login:
    class: src/Contexts/Core/User/application/Login/Login
    arguments: ["@User.Repository"]

  User.Login.LoginQueryHandler:
    class: src/Contexts/Core/User/application/Login/LoginQueryHandler
    arguments: ["@User.Login"]
    tags:
      - { name: "queryHandler" }

