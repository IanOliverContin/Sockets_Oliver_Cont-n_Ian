    tags:
      - { name: "commandHandler" }

  Chat.UpdateDescription.Updater:
    class: src/Contexts/Core/Chat/application/UpdateDescription/Updater
    arguments: ["@Chat.Repository"]

  Chat.UpdateDescription.UpdateChatDescriptionCommandHandler:
    class: src/Contexts/Core/Chat/application/UpdateDescription/UpdateChatDescriptionCommandHandler
    arguments: ["@Chat.UpdateDescription.Updater"]
