    arguments: ["@Chat.UpdateAdminId.Updater"]
    tags:
      - { name: "commandHandler" }

  # =========================================================================
  # ROOM CONTEXT
  # =========================================================================
  Room.Repository:
    class: src/Contexts/Core/Room/infrastructure/TypeOrmRoomRepository
    arguments: ["@Shared.ORM.Connection"]

  Room.FindRoomById.Finder:
    class: src/Contexts/Core/Room/application/FindById/Finder
    arguments: ["@Room.Repository"]

  Room.FindRoomById.FindRoomByIdQueryHandler:
    class: src/Contexts/Core/Room/application/FindById/FindRoomByIdQueryHandler
    arguments: ["@Room.FindRoomById.Finder"]
    tags:
      - { name: "queryHandler" }

  Room.FindByCriteria.Finder:
    class: src/Contexts/Core/Room/application/FindByCriteria/Finder
